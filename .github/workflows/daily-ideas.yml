name: Daily Ideas

on:
  schedule:
    # 06:00 Türkiye saati (UTC+3) = 03:00 UTC. docs/PROJE.md "Akış 1".
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start cron run (cron geçmişi ekranı için)
        working-directory: scripts
        run: pnpm exec tsx start-cron-run.ts
        env:
          WORKFLOW_API_SHARED_SECRET: ${{ secrets.WORKFLOW_API_SHARED_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Fetch source settings (Ayarlar ekranından kapatılan kaynakları atla)
        working-directory: scripts
        run: pnpm exec tsx fetch-settings.ts
        env:
          WORKFLOW_API_SHARED_SECRET: ${{ secrets.WORKFLOW_API_SHARED_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Fetch recent idea names (tekrar kontrolü için)
        working-directory: scripts
        run: pnpm exec tsx fetch-recent-names.ts output/recent-names.json
        env:
          WORKFLOW_API_SHARED_SECRET: ${{ secrets.WORKFLOW_API_SHARED_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Collect trend data (Reddit, App Store, Product Hunt, Hacker News)
        working-directory: scripts
        run: pnpm exec tsx collect-trends.ts output/trends.json
        env:
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          WORKFLOW_API_SHARED_SECRET: ${{ secrets.WORKFLOW_API_SHARED_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Submit trend snapshots (Cron Geçmişi ekranı için)
        working-directory: scripts
        run: pnpm exec tsx submit-trend-snapshots.ts output/trends.json
        env:
          WORKFLOW_API_SHARED_SECRET: ${{ secrets.WORKFLOW_API_SHARED_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Generate 10 ideas with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read prompts/daily-ideas.md and follow its instructions exactly. Do not ask for confirmation or clarification — complete the task end to end and write the output file."
          claude_args: "--max-turns 15 --permission-mode acceptEdits"

      - name: Validate generated ideas (şema + tekrar kontrolü)
        working-directory: scripts
        run: pnpm exec tsx validate-ideas.ts output/ideas.json output/recent-names.json

      - name: Submit ideas batch to API
        working-directory: scripts
        run: pnpm exec tsx submit-ideas.ts output/ideas.json
        env:
          WORKFLOW_API_SHARED_SECRET: ${{ secrets.WORKFLOW_API_SHARED_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # `always()` olmasa bir önceki adım patladığında GitHub Actions bu
      # adımları hiç çalıştırmaz, cron geçmişinde run "running" durumunda asılı
      # kalırdı. success()/failure() ile ikisinden yalnızca biri çalışır.
      # CRON_RUN_ID start-cron-run.ts'ten $GITHUB_ENV ile geldiği için burada
      # env: bloğuna eklemeye gerek yok, runner ortamında zaten var.
      - name: Finish cron run (başarılı)
        if: always() && success()
        working-directory: scripts
        run: pnpm exec tsx finish-cron-run.ts success output/trends.json
        env:
          WORKFLOW_API_SHARED_SECRET: ${{ secrets.WORKFLOW_API_SHARED_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Finish cron run (başarısız)
        if: always() && failure()
        working-directory: scripts
        run: pnpm exec tsx finish-cron-run.ts failed output/trends.json "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          WORKFLOW_API_SHARED_SECRET: ${{ secrets.WORKFLOW_API_SHARED_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
